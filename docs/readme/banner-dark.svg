<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Cetus X ORB: A printed 168 mm ball cage for the BetaFPV Cetus X. Reuse the stock quad, then fly it into walls on purpose."><title>Cetus X ORB: A printed 168 mm ball cage for the BetaFPV Cetus X. Reuse the stock quad, then fly it into walls on purpose.</title><style>
