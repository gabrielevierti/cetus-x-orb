<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 387" width="960" height="387" role="img" aria-label="Features: A 168 mm ball cage: Flat ribs and rings that slot together like an egg crate; a drop of CA on each joint and it's done.; Reuses the stock quad: Motors, flight controller, camera and VTX move to the new frame: plug-in motors, screws, no soldering.; No supports needed: Every part is flat, so a broken rib is a five-minute reprint. Plates sized for a 256 × 256 bed.; Checked in software: 7.7 mm worst-case wall-to-prop distance over 6000 directions, camera clearance from 0 to 40°.; A Python model: Every dimension is a parameter; the script also checks overlaps, assembly and clearances.; Quick battery swaps: Two 1S packs side by side under the frame, swapped through the open bottom."><title>Features: A 168 mm ball cage: Flat ribs and rings that slot together like an egg crate; a drop of CA on each joint and it's done.; Reuses the stock quad: Motors, flight controller, camera and VTX move to the new frame: plug-in motors, screws, no soldering.; No supports needed: Every part is flat, so a broken rib is a five-minute reprint. Plates sized for a 256 × 256 bed.; Checked in software: 7.7 mm worst-case wall-to-prop distance over 6000 directions, camera clearance from 0 to 40°.; A Python model: Every dimension is a parameter; the script also checks overlaps, assembly and clearances.; Quick battery swaps: Two 1S packs side by side under the frame, swapped through the open bottom.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#0969da;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#afb8c1;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes hl{0%{opacity:0}5.00%,13.33%{opacity:1}19.17%,100%{opacity:0}}.hl{opacity:0;animation:hl 9.60s ease-in-out infinite}</style><g><rect x="0.5" y="0.5" width="471.0" height="130" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="0.5" width="471.0" height="130" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:0.00s"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:0.00s"/><g transform="translate(32.0 32)"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12c0 2 4 3.5 9 3.5s9-1.5 9-3.5M12 3c-2.5 2.5-2.5 15.5 0 18M12 3c2.5 2.5 2.5 15.5 0 18" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">A 168 mm ball cage</text><text x="84.0" y="66" class="sans" font-size="13.5" fill="#59636e">Flat ribs and rings that slot together like an egg</text><text x="84.0" y="85" class="sans" font-size="13.5" fill="#59636e">crate; a drop of CA on each joint and it's done.</text></g><g><rect x="488.5" y="0.5" width="471.0" height="130" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="0.5" width="471.0" height="130" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:1.60s"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:1.60s"/><g transform="translate(520.0 32)"><path d="M8 8l8 8M16 8l-8 8M5 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM19 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM5 16.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM19 16.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Reuses the stock quad</text><text x="572.0" y="66" class="sans" font-size="13.5" fill="#59636e">Motors, flight controller, camera and VTX move to</text><text x="572.0" y="85" class="sans" font-size="13.5" fill="#59636e">the new frame: plug-in motors, screws, no</text><text x="572.0" y="104" class="sans" font-size="13.5" fill="#59636e">soldering.</text></g><g><rect x="0.5" y="147.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="147.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:3.20s"/><rect x="24.0" y="171" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="171" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:3.20s"/><g transform="translate(32.0 179)"><path d="M6 9V3h12v6M17 17h2a2 2 0 0 0 2-2v-4a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v4a2 2 0 0 0 2 2h2M7 14h10v7H7z" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="189" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">No supports needed</text><text x="84.0" y="213" class="sans" font-size="13.5" fill="#59636e">Every part is flat, so a broken rib is a five-</text><text x="84.0" y="232" class="sans" font-size="13.5" fill="#59636e">minute reprint. Plates sized for a 256 × 256 bed.</text></g><g><rect x="488.5" y="147.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="147.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:4.80s"/><rect x="512.0" y="171" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="171" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:4.80s"/><g transform="translate(520.0 179)"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="189" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Checked in software</text><text x="572.0" y="213" class="sans" font-size="13.5" fill="#59636e">7.7 mm worst-case wall-to-prop distance over 6000</text><text x="572.0" y="232" class="sans" font-size="13.5" fill="#59636e">directions, camera clearance from 0 to 40°.</text></g><g><rect x="0.5" y="275.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="275.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:6.40s"/><rect x="24.0" y="299" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="299" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:6.40s"/><g transform="translate(32.0 307)"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="317" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">A Python model</text><text x="84.0" y="341" class="sans" font-size="13.5" fill="#59636e">Every dimension is a parameter; the script also</text><text x="84.0" y="360" class="sans" font-size="13.5" fill="#59636e">checks overlaps, assembly and clearances.</text></g><g><rect x="488.5" y="275.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="275.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:8.00s"/><rect x="512.0" y="299" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="299" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:8.00s"/><g transform="translate(520.0 307)"><path d="M3 7h15v10H3zM21 10v4M6 10v4M9 10v4" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="317" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Quick battery swaps</text><text x="572.0" y="341" class="sans" font-size="13.5" fill="#59636e">Two 1S packs side by side under the frame, swapped</text><text x="572.0" y="360" class="sans" font-size="13.5" fill="#59636e">through the open bottom.</text></g></svg>
