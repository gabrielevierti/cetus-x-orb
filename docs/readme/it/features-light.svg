<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 406" width="960" height="406" role="img" aria-label="Features: Una gabbia da 168 mm: Costole e anelli piatti che si incastrano come un separatore per uova; una goccia di ciano e hai finito.; Riusa il drone di serie: Motori, FC, camera e VTX passano sul nuovo telaio: motori a spinotto, viti, niente saldature.; Niente supporti: Ogni pezzo è piatto, quindi una costola rotta si ristampa in cinque minuti. Piatti per piano 256 × 256.; Verificata al computer: 7,7 mm tra muro ed eliche nel caso peggiore su 6000 direzioni, camera libera da 0 a 40°.; Un modello in Python: Ogni misura è un parametro; lo script controlla anche compenetrazioni, montaggio e distanze.; Batterie al volo: Due 1S affiancate sotto il telaio, da cambiare dal fondo aperto."><title>Features: Una gabbia da 168 mm: Costole e anelli piatti che si incastrano come un separatore per uova; una goccia di ciano e hai finito.; Riusa il drone di serie: Motori, FC, camera e VTX passano sul nuovo telaio: motori a spinotto, viti, niente saldature.; Niente supporti: Ogni pezzo è piatto, quindi una costola rotta si ristampa in cinque minuti. Piatti per piano 256 × 256.; Verificata al computer: 7,7 mm tra muro ed eliche nel caso peggiore su 6000 direzioni, camera libera da 0 a 40°.; Un modello in Python: Ogni misura è un parametro; lo script controlla anche compenetrazioni, montaggio e distanze.; Batterie al volo: Due 1S affiancate sotto il telaio, da cambiare dal fondo aperto.</title><style>
.sans{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif} .mono{font-family:ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace}
.hair{fill:none;stroke:#0969da;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round}
.dimline{fill:none;stroke:#afb8c1;stroke-width:1;stroke-linecap:round}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blip{0%{opacity:1}55%,100%{opacity:.12}}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@keyframes ring{0%{r:3px;opacity:.9}100%{r:16px;opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
@keyframes hl{0%{opacity:0}5.00%,13.33%{opacity:1}19.17%,100%{opacity:0}}.hl{opacity:0;animation:hl 9.60s ease-in-out infinite}</style><g><rect x="0.5" y="0.5" width="471.0" height="130" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="0.5" width="471.0" height="130" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:0.00s"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="24" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:0.00s"/><g transform="translate(32.0 32)"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12c0 2 4 3.5 9 3.5s9-1.5 9-3.5M12 3c-2.5 2.5-2.5 15.5 0 18M12 3c2.5 2.5 2.5 15.5 0 18" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="42" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Una gabbia da 168 mm</text><text x="84.0" y="66" class="sans" font-size="13.5" fill="#59636e">Costole e anelli piatti che si incastrano come un</text><text x="84.0" y="85" class="sans" font-size="13.5" fill="#59636e">separatore per uova; una goccia di ciano e hai</text><text x="84.0" y="104" class="sans" font-size="13.5" fill="#59636e">finito.</text></g><g><rect x="488.5" y="0.5" width="471.0" height="130" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="0.5" width="471.0" height="130" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:1.60s"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="24" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:1.60s"/><g transform="translate(520.0 32)"><path d="M8 8l8 8M16 8l-8 8M5 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM19 2.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM5 16.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zM19 16.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5z" fi