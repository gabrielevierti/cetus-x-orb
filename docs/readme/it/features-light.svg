da" fill-opacity=".12" class="hl" style="animation-delay:4.80s"/><g transform="translate(520.0 179)"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6zM9 12l2 2 4-4" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="189" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Verificata al computer</text><text x="572.0" y="213" class="sans" font-size="13.5" fill="#59636e">7,7 mm tra muro ed eliche nel caso peggiore su</text><text x="572.0" y="232" class="sans" font-size="13.5" fill="#59636e">6000 direzioni, camera libera da 0 a 40°.</text></g><g><rect x="0.5" y="294.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="0.5" y="294.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:6.40s"/><rect x="24.0" y="318" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="24.0" y="318" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:6.40s"/><g transform="translate(32.0 326)"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="84.0" y="336" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Un modello in Python</text><text x="84.0" y="360" class="sans" font-size="13.5" fill="#59636e">Ogni misura è un parametro; lo script controlla</text><text x="84.0" y="379" class="sans" font-size="13.5" fill="#59636e">anche compenetrazioni, montaggio e distanze.</text></g><g><rect x="488.5" y="294.5" width="471.0" height="111" rx="12" fill="#f6f8fa" stroke="#d0d7de"/><rect x="488.5" y="294.5" width="471.0" height="111" rx="12" fill="none" stroke="#0969da" stroke-opacity=".5" class="hl" style="animation-delay:8.00s"/><rect x="512.0" y="318" width="40" height="40" rx="10" fill="none" stroke="#d0d7de"/><rect x="512.0" y="318" width="40" height="40" rx="10" fill="#0969da" fill-opacity=".12" class="hl" style="animation-delay:8.00s"/><g transform="translate(520.0 326)"><path d="M3 7h15v10H3zM21 10v4M6 10v4M9 10v4" fill="none" stroke="#0969da" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></g><text x="572.0" y="336" class="sans" font-size="16.5" font-weight="700" fill="#1f2328">Batterie al volo</text><text x="572.0" y="360" class="sans" font-size="13.5" fill="#59636e">Due 1S affiancate sotto il telaio, da cambiare dal</text><text x="572.0" y="379" class="sans" font-size="13.5" fill="#59636e">fondo aperto.</text></g></svg>
